<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Temple placeholder illustration</title>
  <desc id="desc">A simple stylized temple building beneath a blue sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc5f2"/>
      <stop offset="1" stop-color="#d8ecfb"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa36b"/>
      <stop offset="1" stop-color="#486b45"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <circle cx="500" cy="70" r="34" fill="#fff7c8" opacity=".9"/>
  <rect y="300" width="600" height="100" fill="url(#ground)"/>
  <rect x="150" y="205" width="300" height="120" rx="6" fill="#f8f7f2" stroke="#b7b4aa" stroke-width="4"/>
  <rect x="215" y="150" width="70" height="175" fill="#ffffff" stroke="#b7b4aa" stroke-width="4"/>
  <rect x="315" y="150" width="70" height="175" fill="#ffffff" stroke="#b7b4aa" stroke-width="4"/>
  <polygon points="250,55 225,150 275,150" fill="#ffffff" stroke="#b7b4aa" stroke-width="4"/>
  <polygon points="350,55 325,150 375,150" fill="#ffffff" stroke="#b7b4aa" stroke-width="4"/>
  <line x1="250" y1="30" x2="250" y2="58" stroke="#d3a93e" stroke-width="5"/>
  <line x1="350" y1="30" x2="350" y2="58" stroke="#d3a93e" stroke-width="5"/>
  <rect x="275" y="235" width="50" height="90" rx="24" fill="#7b6a58"/>
  <g fill="#9fc8e8">
    <rect x="175" y="235" width="28" height="42" rx="3"/>
    <rect x="397" y="235" width="28" height="42" rx="3"/>
    <rect x="230" y="190" width="18" height="30" rx="2"/>
    <rect x="352" y="190" width="18" height="30" rx="2"/>
  </g>
  <g fill="#315b3f">
    <circle cx="95" cy="300" r="40"/>
    <circle cx="505" cy="300" r="40"/>
  </g>

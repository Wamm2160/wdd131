<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WDD 131 product review form assignment by Wilson Macías.">
  <meta name="author" content="Wilson Macías">
  <title>Product Review Form | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header><h1>Product Review</h1></header>
  <main>
    <form method="get" action="review.html">
      <fieldset>
        <legend>Review Information</legend>

        <label for="product-name">Product Name <span class="required">*</span></label>
        <select id="product-name" name="product-name" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <p class="label-text">Overall Rating <span class="required">*</span></p>
        <div class="rating-group">
          <div><label for="rating1">1 ☆</label><input type="radio" id="rating1" name="rating" value="1" required></div>
          <div><label for="rating2">2 ☆☆</label><input type="radio" id="rating2" name="rating" value="2" required></div>
          <div><label for="rating3">3 ☆☆☆</label><input type="radio" id="rating3" name="rating" value="3" required></div>
          <div><label for="rating4">4 ☆☆☆☆</label><input type="radio" id="rating4" name="rating" value="4" required></div>
          <div><label for="rating5">5 ☆☆☆☆☆</label><input type="radio" id="rating5" name="rating" value="5" required></div>
        </div>

        <label for="install-date">Date of Installation <span class="required">*</span></label>
        <input type="date" id="install-date" name="install-date" required>

        <p class="label-text">Useful Features</p>
        <p class="hint">Check all that apply.</p>
        <div class="checkbox-group">
          <label for="durability"><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
          <label for="ease-of-use"><input type="checkbox" id="ease-of-use" name="features" value="ease-of-use"> Ease of Use</label>
          <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
          <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
        </div>

        <label for="written-review">Written Review</label>
        <textarea id="written-review" name="written-review" rows="5" placeholder="Share your experience with this product."></textarea>

        <label for="user-name">Your Name</label>
        <input type="text" id="user-name" name="user-name" autocomplete="name">

        <input type="submit" value="Submit Review">
      </fieldset>
    </form>
  </main>
  <footer>
    <p>&copy; <span id="currentyear"></span> Wilson Macías | Mexico</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>

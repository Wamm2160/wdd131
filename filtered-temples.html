<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filtered Temple Album | WDD 131 | Wilson Macías</title>
    <meta
      name="description"
      content="WDD 131 filtered temple album by Wilson Macías featuring responsive temple cards, JavaScript filters, native lazy loading, and a mobile navigation menu."
    >
    <meta name="author" content="Wilson Macías">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@400;500&display=swap"

    <link rel="stylesheet" href="styles/filtered-temples.css">

  <body>
    <header>
      <div class="header-content">
        <span class="site-title">Temple Album</span>

          aria-controls="primary-navigation"

        <nav id="primary-navigation" aria-label="Temple filters">
          <a class="active" href="#" data-filter="home">Home</a>

          <a href="#" data-filter="large">Large</a>
          <a href="#" data-filter="small">Small</a>
        </nav>
      </div>
    </header>

    <main>
      <h1 id="page-heading">Home</h1>
      <div id="temple-cards" class="temple-grid"></div>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> Wilson Macías | Mexico</p>
